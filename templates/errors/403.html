<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Forbidden - Skincare AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="text-center">
            <div class="mb-8">
                <div class="mx-auto w-32 h-32 bg-gradient-to-r from-red-400 to-red-600 rounded-full flex items-center justify-center mb-6">
                    <i data-lucide="lock" class="w-16 h-16 text-white"></i>
                </div>
                <h1 class="text-6xl font-bold text-gray-800 mb-4">403</h1>
                <h2 class="text-3xl font-bold text-gray-700 mb-4">Access Forbidden</h2>
                <p class="text-xl text-gray-600 mb-8 max-w-2xl mx-auto">
                    You don't have permission to access this page. Please contact an administrator if you believe this is an error.
                </p>
            </div>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="{{ url_for('main.index') }}" class="inline-block bg-gradient-to-r from-green-500 to-green-600 text-white px-8 py-4 rounded-xl hover:from-green-600 hover:to-green-700 transition-all duration-300 text-lg font-semibold shadow-lg hover:shadow-xl transform hover:-translate-y-1 flex items-center justify-center gap-2">
                    <i data-lucide="home" class="w-5 h-5"></i>
                    <span>Go to Home</span>
                </a>
                {% if current_user.is_authenticated %}
                <a href="{{ url_for('auth.logout') }}" class="inline-block bg-gray-500 text-white px-8 py-4 rounded-xl hover:bg-gray-600 transition-all duration-300 text-lg font-semibold shadow-lg hover:shadow-xl transform hover:-translate-y-1 flex items-center justify-center gap-2">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    <span>Logout</span>
                </a>
                {% endif %}
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
